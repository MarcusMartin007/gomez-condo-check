<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Cardo"; src: url("../public/fonts/cardo-latin-700-normal.woff2"); font-weight: 700; }
  @font-face { font-family: "Cardo"; src: url("../public/fonts/cardo-latin-400-italic.woff2"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "Cardo"; src: url("../public/fonts/cardo-latin-400-normal.woff2"); font-weight: 400; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #E5DAC4; color: #284055; font-family: "Cardo", Georgia, serif; position: relative; }
  .ph { position: absolute; right: 0; top: 0; width: 420px; height: 630px; overflow: hidden; background: #284055; }
  .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
  .mark { position: absolute; left: 72px; top: 56px; width: 70px; height: 70px; }
  .body { position: absolute; left: 72px; top: 170px; width: 640px; }
  .eyebrow { font-weight: 700; font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: #A8693D; }
  h1 { font-weight: 700; font-size: 64px; line-height: 1.04; letter-spacing: -0.01em; margin-top: 18px; }
  .rule { width: 64px; height: 3px; background: #A8693D; margin: 28px 0 22px; }
  .sub { font-style: italic; font-size: 28px; line-height: 1.3; }
  .foot { position: absolute; left: 72px; bottom: 40px; width: 640px; border-top: 2px solid #A8693D; padding-top: 12px; font-size: 17px; display: flex; justify-content: space-between; }
  .foot b { font-weight: 700; }
</style></head>
<body>
  <img class="mark" src="../public/img/mark.png" alt="">
  <div class="body">
    <div class="eyebrow">Pinellas condo building check</div>
    <h1>Thinking about a condo? Send me the building name.</h1>
    <div class="rule"></div>
    <div class="sub">A note back within one business day.</div>
  </div>
  <div class="foot"><span>Carolyn Gomez, REALTOR® · RE/MAX Action First</span><b>The Gomez Group</b></div>
  <div class="ph"><img src="../public/img/carolyn.jpg" alt=""></div>
</body></html>
